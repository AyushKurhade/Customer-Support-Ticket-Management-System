<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration — Customer Support Desk</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-card {
            max-width: 480px;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .demo-chip {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px dashed #cbd5e1;
        }
        .demo-chip:hover {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-headset text-primary fs-4"></i>
                <span class="fw-bold">SupportDesk <small class="text-muted fw-normal fs-6">Enterprise</small></span>
            </a>
            <div class="ms-auto">
                <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> Home</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        <div class="auth-card card p-4 bg-white">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-primary rounded-circle mb-2">
                    <i class="fa-solid fa-shield-halved fs-3"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Welcome to SupportDesk</h3>
                <p class="text-muted small">Sign in to manage your tickets, support queues, or system analytics</p>
            </div>

            <!-- Tabs: Login vs Register -->
            <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button">
                        <i class="fa-solid fa-user-plus me-1"></i> Customer Register
                    </button>
                </li>
            </ul>

            <!-- Alert Box -->
            <div id="authAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

            <div class="tab-content" id="authTabsContent">
                <!-- Sign In Form -->
                <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-regular fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="loginEmail" placeholder="e.g. alice@customer.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginSubmitBtn">
                            <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- Quick Fill Demo Profiles -->
                    <div class="mt-4 pt-3 border-top">
                        <span class="small fw-semibold text-muted text-uppercase d-block mb-2 text-center" style="font-size:0.75rem; letter-spacing:0.5px;">
                            Quick-Fill Evaluation Credentials
                        </span>
                        <div class="row g-2">
                            <div class="col-4">
                                <div class="p-2 rounded demo-chip text-center" onclick="fillCredentials('admin@support.com', 'Password@123')">
                                    <i class="fa-solid fa-user-shield text-primary d-block mb-1"></i>
                                    <strong class="d-block small text-dark">Admin</strong>
                                    <span class="text-muted" style="font-size:0.7rem;">Full control</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="p-2 rounded demo-chip text-center" onclick="fillCredentials('sarah.agent@support.com', 'Password@123')">
                                    <i class="fa-solid fa-headset text-warning d-block mb-1"></i>
                                    <strong class="d-block small text-dark">Agent</strong>
                                    <span class="text-muted" style="font-size:0.7rem;">Queue & Notes</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="p-2 rounded demo-chip text-center" onclick="fillCredentials('alice@customer.com', 'Password@123')">
                                    <i class="fa-solid fa-user text-success d-block mb-1"></i>
                                    <strong class="d-block small text-dark">Customer</strong>
                                    <span class="text-muted" style="font-size:0.7rem;">Submit tickets</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Registration Form -->
                <div class="tab-pane fade" id="register-panel" role="tabpanel">
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="mb-2">
                            <label class="form-label fw-semibold small text-secondary">Full Name</label>
                            <input type="text" class="form-control" id="regName" placeholder="e.g. John Doe" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label fw-semibold small text-secondary">Email Address</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="e.g. john@example.com" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label fw-semibold small text-secondary">Contact Number</label>
                            <input type="tel" class="form-control" id="regPhone" placeholder="e.g. 555-0199" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Password</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="Minimum 6 characters" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" id="regSubmitBtn">
                            <i class="fa-solid fa-user-plus me-1"></i> Create Customer Account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Client -->
    <script src="/static/js/api.js"></script>

    <script>
        function fillCredentials(email, pwd) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = pwd;
            clearAlert();
        }

        function showAlert(msg, isSuccess = false) {
            const el = document.getElementById('authAlert');
            el.className = `alert alert-${isSuccess ? 'success' : 'danger'} py-2 px-3 small`;
            el.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-triangle-exclamation'} me-2"></i> ${msg}`;
            el.classList.remove('d-none');
        }

        function clearAlert() {
            const el = document.getElementById('authAlert');
            el.classList.add('d-none');
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Signing In...`;

            try {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                const res = await API.post('/api/auth/login', { email, password });
                const role = (res.user && res.user.role ? res.user.role : '').toLowerCase();

                showAlert('Login successful! Redirecting...', true);
                setTimeout(() => {
                    if (role === 'admin') {
                        window.location.href = '/admin_dashboard.html';
                    } else if (role === 'agent') {
                        window.location.href = '/agent_portal.html';
                    } else {
                        window.location.href = '/customer_portal.html';
                    }
                }, 700);
            } catch (err) {
                showAlert(err.message || 'Login failed. Please verify credentials.');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('regSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Creating Account...`;

            try {
                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const contact_number = document.getElementById('regPhone').value.trim();
                const password = document.getElementById('regPassword').value;

                await API.post('/api/auth/register', { name, email, contact_number, password });
                showAlert('Account created successfully! Auto logging in...', true);

                // Auto login as newly registered customer
                await API.post('/api/auth/login', { email, password });
                setTimeout(() => {
                    window.location.href = '/customer_portal.html';
                }, 700);
            } catch (err) {
                showAlert(err.message || 'Registration failed.');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-user-plus me-1"></i> Create Customer Account`;
            }
        }

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await API.get('/api/auth/me');
                if (res.user) {
                    const role = res.user.role.toLowerCase();
                    if (role === 'admin') window.location.href = '/admin_dashboard.html';
                    else if (role === 'agent') window.location.href = '/agent_portal.html';
                    else window.location.href = '/customer_portal.html';
                }
            } catch (_) {}
        });
    </script>
</body>
</html>
